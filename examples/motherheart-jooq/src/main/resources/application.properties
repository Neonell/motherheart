# ---------------------------------------------------------------- the heart
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/shop
%prod.quarkus.datasource.username=shop
%prod.quarkus.datasource.password=shop

# The schema is owned by SQL migrations; jOOQ generates its Java view of it from the same files.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.locations=db/migration,db/testdata
%test.quarkus.flyway.locations=db/migration,db/testdata
# Dev Services containers may be reused (testcontainers.reuse.enable): always start from a known heart.
%dev.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-at-start=true

# ---------------------------------------------------------------- visibility
# Trust requires visibility: every executed statement (with its bind values) is printed in dev and test.
%dev.quarkus.log.category."org.jooq.tools.LoggerListener".level=DEBUG
%test.quarkus.log.category."org.jooq.tools.LoggerListener".level=DEBUG
quarkus.log.category."org.jooq.Constants".level=WARN
